/* v57 */
/* Düzen: solda çizgili menü düğmesi ve soldan açılan çekmece, ortada dar editoryal sütun. Ana sayfada altın çerçeveli üyelik kartı. Tek, koyu ve elit bir görünüm. */
:root {

  --bg2: #0b0c12;

  --warn: #ec7b70;
  --cool: #7cc7ea;
  --violet: #bba6ff;
  --font-display: 'Bodoni Moda', 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f4ee; --bg2: #ece9df; --surface: #ffffff; --surface2: #f1eee5; --line: #d8d2c2;
  --gold: #9a7424; --gold-hi: #6f510f; --gold-lo: #c7b27c; --gold-ink: #ffffff;
  --fg: #14120d; --muted: #5d5b66; --good: #1d7443; --warn: #b3372b; --cool: #1b6a90; --violet: #5a43b5;
  color-scheme: light;
}
:root[data-theme="light"] body { background-image: radial-gradient(900px 520px at 85% -8%, rgba(154,116,36,.10), transparent 62%); }
:root[data-theme="light"] .scrim, :root[data-theme="light"] .modal { background: rgba(20,18,13,.45); }

.stat { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font: 500 .7rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat.s-hazir { color: var(--cool); border-color: var(--cool); }

.stat.s-iptal { color: var(--warn); border-color: var(--warn); }

}

/* ---------- Düğmeler ve formlar ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none;

}

/* ---------- Güvenlik kontrolü ---------- */
.gate {

}

.brand { display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; min-width: 0; }

/* ---------- İçerik ---------- */
